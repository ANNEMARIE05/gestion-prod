<div class="space-y-8">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">
        Profils & droits
      </h1>
      <p class="text-sm text-gray-500">
        Définissez les rôles applicatifs et les périmètres d'accès associés.
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-3">
      @if (perm.canImport()) {
        <input
          #csvInput
          type="file"
          accept=".csv"
          class="hidden"
          (change)="importCsv($event)"
        />
        <button
          mat-stroked-button
          type="button"
          (click)="csvInput.click()"
          class="!rounded-2xl !border-slate-200 !text-slate-600 !py-4 !px-5 !mb-1 bg-white shadow-sm"
        >
          <mat-icon class="mr-2">upload_file</mat-icon>
          Importer
        </button>
      }
      @if (perm.canExport()) {
        <button
          mat-stroked-button
          type="button"
          (click)="exportCsv()"
          class="!rounded-2xl !border-slate-200 !text-slate-600 !py-4 !px-5 !mb-1 bg-white shadow-sm"
        >
          <mat-icon class="mr-2">file_download</mat-icon>
          Exporter
        </button>
      }
      @if (perm.canDownloadTemplate()) {
        <button
          mat-stroked-button
          type="button"
          (click)="downloadTemplateCsv()"
          class="!rounded-2xl !border-slate-200 !text-slate-600 !py-4 !px-5 !mb-1 bg-white shadow-sm"
        >
          <mat-icon class="mr-2">download</mat-icon>
          Télécharger modèle
        </button>
      }
      @if (perm.canCreate()) {
        <button
          mat-flat-button
          color="primary"
          type="button"
          routerLink="/utilisateurs/profils/create"
          class="!rounded-2xl !px-7 !py-4 !mb-1 shadow-xl shadow-indigo-200"
        >
          <mat-icon class="mr-2">add</mat-icon>
          Nouveau profil
        </button>
      }
    </div>
  </div>

  <app-profils-list></app-profils-list>
</div>
