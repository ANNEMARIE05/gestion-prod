<div class="space-y-8">
  <div>
    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Paramétrage</h1>
    <p class="text-sm text-gray-500">
      Configurez les briques de l’application : menus, actions, structure
      organisationnelle et référentiels.
    </p>
    <div class="atypical-section-band mt-3"></div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
    @for (card of cards; track card.route) {
      <a
        [routerLink]="card.route"
        class="atypical-soft-block p-5 flex flex-col gap-3 border border-slate-100/80 shadow-sm rounded-2xl transition hover:border-indigo-200 hover:shadow-md outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
      >
        <div class="flex items-center justify-between gap-3">
          <span class="text-sm font-semibold text-gray-700">{{
            card.title
          }}</span>
          <span
            class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-white shadow-md"
            [class]="card.gradient"
          >
            <mat-icon class="!text-[22px] !w-[22px] !h-[22px]">{{
              card.icon
            }}</mat-icon>
          </span>
        </div>
        <p class="text-sm text-gray-500 leading-relaxed m-0">
          {{ card.description }}
        </p>
        <span
          class="text-xs font-medium flex items-center gap-1"
          [class]="card.linkClass"
        >
          {{ card.cta }}
          <mat-icon class="!text-[14px] !w-[14px] !h-[14px]"
            >chevron_right</mat-icon
          >
        </span>
      </a>
    }
  </div>
</div>
