<div class="flex h-screen bg-slate-50 antialiased overflow-hidden">
  <!-- Sidebar -->
  <aside class="hidden lg:block flex-shrink-0 transition-all duration-300 ease-in-out"
         [class.w-72]="!sidebarCollapsed()"
         [class.w-20]="sidebarCollapsed()">
    <app-sidebar></app-sidebar>
  </aside>

  <!-- Mobile drawer + backdrop (visible uniquement sous le breakpoint lg) -->
  <div class="lg:hidden">
    <div *ngIf="mobileSidebarOpen()"
         (click)="closeMobileSidebar()"
         class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm transition-opacity duration-300"></div>

    <aside class="fixed inset-y-0 left-0 z-50 w-72 max-w-[80vw] transform transition-transform duration-300 ease-in-out shadow-2xl"
           [class.translate-x-0]="mobileSidebarOpen()"
           [class.-translate-x-full]="!mobileSidebarOpen()">
      <app-sidebar [mobile]="true"></app-sidebar>
    </aside>
  </div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="z-10 shadow-sm">
      <app-topbar></app-topbar>
    </header>

    <main class="flex-1 overflow-y-auto p-6">
      <div class="max-w-7xl mx-auto h-full">
        <!-- Router Outlet for Child Components -->
        <router-outlet></router-outlet>
      </div>
    </main>

    <footer class="bg-white border-t border-gray-100 py-4 px-6 text-center">
      <p class="text-xs text-gray-400">
        &copy; 2026 Gestion de Prod - Tous droits réservés.
      </p>
    </footer>
  </div>
</div>
